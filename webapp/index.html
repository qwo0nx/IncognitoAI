<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agent-Monster AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1e1e1e);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --button-color: var(--tg-theme-button-color, #8774e1);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #2d2d2d);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 85%;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user {
            align-self: flex-end;
            background-color: var(--button-color);
            color: white;
            border-bottom-right-radius: 5px;
        }
        .ai {
            align-self: flex-start;
            background-color: var(--secondary-bg);
            border-bottom-left-radius: 5px;
        }
        .input-area {
            display: flex;
            padding: 10px;
            background-color: var(--secondary-bg);
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background-color: var(--bg-color);
            color: var(--text-color);
            outline: none;
            font-size: 16px;
        }
        button {
            margin-left: 10px;
            padding: 0 20px;
            border: none;
            border-radius: 10px;
            background-color: var(--button-color);
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        button:active { opacity: 0.8; }
        .loader { font-style: italic; opacity: 0.7; }
    </style>
</head>
<body>
    <div id="chat">
        <div class="message ai">Привет! Я твой Agent-Monster. Задай мне любой вопрос прямо здесь.</div>
    </div>
    <div class="input-area">
        <input type="text" id="msg-input" placeholder="Напиши сообщение..." autocomplete="off">
        <button onclick="sendMessage()">➤</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        const chat = document.getElementById('chat');
        const input = document.getElementById('msg-input');

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.innerText = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;
            
            input.value = '';
            addMessage(text, 'user');
            const loader = addMessage('Печатает...', 'ai loader');

            try {
                // Отправляем запрос на наш Python-сервер
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        text: text,
                        user_id: tg.initDataUnsafe?.user?.id || 0
                    })
                });
                
                const data = await response.json();
                loader.innerText = data.reply;
                loader.classList.remove('loader');
            } catch (e) {
                loader.innerText = "⚠️ Ошибка соединения с сервером.";
                loader.classList.remove('loader');
            }
        }

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
